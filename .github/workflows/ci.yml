name: package-validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          echo "package.json is valid JSON"

      - name: Check required package fields
        run: |
          node -e "
          const p = JSON.parse(require('fs').readFileSync('package.json','utf8'));
          for (const k of ['name','version','unity','license']) {
            if (!p[k]) { console.error('missing field: ' + k); process.exit(1); }
          }
          if (!p.name.startsWith('com.juahn.v2.')) { console.error('name must start with com.juahn.v2.'); process.exit(1); }
          console.log('package fields OK: ' + p.name + '@' + p.version);
          "

      - name: Check assembly definition present
        run: |
          # find를 쓴다. bash의 ** 는 globstar 없이는 재귀 전개가 되지 않아,
          # asmdef가 더 깊은 폴더로 옮겨가면 조용히 못 찾는다.
          if ! find Runtime -name '*.asmdef' | grep -q . ; then
            echo "no Runtime asmdef found"; exit 1
          fi
          echo "asmdef present"

      - name: Guard core assembly purity
        run: |
          if grep -rnE "using UnityEngine|UnityEngine\\." Runtime/Core/ ; then
            echo "Runtime/Core must not reference UnityEngine"; exit 1
          fi
          echo "core purity OK"

      - name: Check every imported file has a .meta
        run: |
          # git으로 배포되는 UPM 패키지에서 .meta가 빠지면 클론할 때마다 Unity가
          # 새 GUID를 만든다. 그러면 MotionPlayer를 붙인 프리팹의 스크립트 참조가
          # 다른 머신에서 통째로 끊긴다. Unity가 무시하는 것(.github, ~로 끝나는 폴더)만 뺀다.
          missing=0
          for f in $(git ls-files | grep -v '\.meta$' | grep -v '^\.github/' | grep -v '~/'); do
            if [ ! -e "$f.meta" ]; then echo "meta 없음: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "meta 파일 전부 있음"

      - name: Check for duplicate meta GUIDs
        run: |
          dups=$(git ls-files '*.meta' | xargs grep -h '^guid:' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "GUID 중복: $dups"; exit 1; fi
          echo "GUID 중복 없음"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run core tests
        run: dotnet test Tests~/dotnet/UiMotion.Core.Tests.csproj --verbosity minimal

      - name: Note Unity layer verification
        run: |
          # Runtime/Unity는 UnityEngine 어셈블리가 필요한데 그것은 재배포할 수 없다.
          # 그래서 컴파일 검증은 로컬 게이트다: ./Tools~/compile-check/run.sh
          # Unity 파일을 건드리는 커밋은 그것을 통과해야 한다.
          if [ ! -x Tools~/compile-check/run.sh ]; then
            echo "Tools~/compile-check/run.sh가 없거나 실행 권한이 없습니다"; exit 1
          fi
          echo "Unity 계층 컴파일 게이트가 제자리에 있습니다 (로컬 실행)"
